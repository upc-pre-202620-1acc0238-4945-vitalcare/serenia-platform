# Spring Application Name
spring.application.name=Serenia Platform

# Default to development when no explicit profile is provided.
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.serenia.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
# Store and read every instant in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Application Information for Documentation

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties
# The signing key is read from JWT_SECRET; the fallback is only meant for local development.
authorization.jwt.secret=${JWT_SECRET:WriteHereYourSecretStringForTokenSigningCredentials}
authorization.jwt.expiration.days=7

# Care Circle Configuration
# Validity of an invitation code and how often the due codes are marked as expired (ISO-8601 durations)
care-circle.invitation-code.validity=PT48H
care-circle.invitation-code.expiration-check-interval=PT5M

# Daily Check-in Configuration
# How often today's check-ins are opened, and how often pending ones are prompted or closed (ISO-8601 durations)
daily-check-in.opening-interval=PT1H
daily-check-in.opening-initial-delay=PT15S
daily-check-in.lifecycle-interval=PT1M

# Social Companionship Configuration
# Media storage: "local" keeps the files in a directory (development); "azure" uses a private Azure Blob container
social-companionship.media.storage-provider=${MEDIA_STORAGE_PROVIDER:local}
social-companionship.media.local-directory=${MEDIA_LOCAL_DIRECTORY:./media-storage}
social-companionship.media.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
social-companionship.media.azure.container=${AZURE_STORAGE_CONTAINER:serenia-media}
social-companionship.media.max-file-size=10MB
# Slightly above the media limit, so oversized files get a clear 413 from the application
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB
# How often due reminders are presented, and how often reminders whose day ended are closed (ISO-8601 durations)
social-companionship.reminders.presentation-interval=PT1M
social-companionship.reminders.missed-check-interval=PT1H

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Flyway Configuration
spring.flyway.enabled=false

