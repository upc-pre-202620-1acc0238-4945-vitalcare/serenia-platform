# Development profile
# Use Dockerfile-compatible environment variable names with local defaults.
spring.datasource.url=jdbc:mysql://localhost:3306/serenia?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true&publicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# App port
server.port=8080

